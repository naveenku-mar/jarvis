<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KALKI / AI Assistant</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #0a192f, #020617);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 16px;
      text-align: center;
      overflow-x: hidden;
    }
    .hud-title {
      font-size: 0.8rem;
      letter-spacing: 2px;
      color: #38bdf8;
      text-transform: uppercase;
      margin-top: 10px;
    }
    h1 {
      font-size: clamp(1.8rem, 6vw, 2.5rem);
      font-weight: 800;
      color: #38bdf8;
      margin: 12px 0 6px;
      line-height: 1.1;
    }
    .status {
      font-size: 0.8rem;
      padding: 4px 14px;
      border: 1px solid #0284c7;
      border-radius: 20px;
      color: #38bdf8;
      background: rgba(2, 132, 199, 0.15);
      display: inline-block;
      margin-bottom: 15px;
    }
    .orb-container {
      position: relative;
      width: 150px;
      height: 150px;
      margin: 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .orb {
      width: 85px;
      height: 85px;
      background: radial-gradient(circle, #38bdf8, #2563eb);
      border-radius: 50%;
      box-shadow: 0 0 35px #0284c7, 0 0 70px rgba(56, 189, 248, 0.35);
      transition: transform 0.3s ease, background 0.3s ease;
    }
    .orb.listening {
      animation: pulse 1.2s infinite ease-in-out;
      background: radial-gradient(circle, #f43f5e, #be123c);
      box-shadow: 0 0 45px #f43f5e, 0 0 80px rgba(244, 63, 94, 0.4);
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }
    .output {
      font-size: 0.95rem;
      color: #94a3b8;
      min-height: 52px;
      max-width: 92%;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .action-btn {
      background: #0369a1;
      color: #fff;
      border: 1px solid #38bdf8;
      padding: 14px 32px;
      border-radius: 30px;
      font-size: 1.05rem;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
      touch-action: manipulation;
      transition: transform 0.1s ease;
    }
    .action-btn:active { 
      transform: scale(0.95); 
    }
  </style>
</head>
<body>

  <div>
    <p class="hud-title">◈ KALKI / J.A.R.V.I.S.</p>
    <h1>AI ASSISTANT</h1>
    <span id="status-tag" class="status">SYSTEM ONLINE</span>
  </div>

  <div class="orb-container">
    <div id="ai-orb" class="orb"></div>
  </div>

  <p id="chat-output" class="output">Tap below and speak to interact...</p>

  <button id="wake-btn" class="action-btn">● WAKE KALKI</button>

  <script>
    const wakeBtn = document.getElementById('wake-btn');
    const output = document.getElementById('chat-output');
    const orb = document.getElementById('ai-orb');
    const statusTag = document.getElementById('status-tag');

    // Detect mobile device
    const isMobile = /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      output.innerText = "Error: Speech recognition not supported in this browser. Please use Chrome.";
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.continuous = false;
      recognition.interimResults = false;

      wakeBtn.addEventListener('click', () => {
        try {
          output.innerText = "Listening... Speak now!";
          statusTag.innerText = "LISTENING...";
          orb.classList.add('listening');
          recognition.start();
        } catch (err) {
          output.innerText = "Recognition active or starting...";
        }
      });

      recognition.onresult = async (event) => {
        const userText = event.results[0][0].transcript;
        output.innerText = `Heard: "${userText}"`;
        orb.classList.remove('listening');
        statusTag.innerText = "PROCESSING...";

        // 1. Check for App Opening Commands
        const handled = handleAppCommands(userText);
        if (handled) {
          statusTag.innerText = "SYSTEM ONLINE";
          return;
        }

        // 2. Fall back to Gemini AI for regular questions
        statusTag.innerText = "THINKING...";
        const reply = await queryAI(userText);
        output.innerText = `KALKI: ${reply}`;
        statusTag.innerText = "SYSTEM ONLINE";
        speak(reply);
      };

      recognition.onerror = (event) => {
        orb.classList.remove('listening');
        statusTag.innerText = "ERROR";
        output.innerText = `Voice Error: ${event.error}`;
      };

      recognition.onend = () => {
        orb.classList.remove('listening');
        if (statusTag.innerText === "LISTENING...") {
          statusTag.innerText = "SYSTEM ONLINE";
        }
      };
    }

    // Handles open commands on both Laptop and Mobile
    function handleAppCommands(rawPrompt) {
      const prompt = rawPrompt.toLowerCase().trim();

      // Open YouTube
      if (prompt.includes("open youtube") || prompt.includes("launch youtube")) {
        speak("Opening YouTube, Sir.");
        output.innerText = "KALKI: Opening YouTube...";

        if (isMobile) {
          // On mobile, top-level assign triggers the installed YouTube app directly
          window.location.assign("https://www.youtube.com");
        } else {
          // On laptops/desktops, open a new tab
          const win = window.open("https://www.youtube.com", "_blank");
          if (!win) window.location.href = "https://www.youtube.com";
        }
        return true;
      }

      // Open Chrome / Google
      if (prompt.includes("open chrome") || prompt.includes("open browser") || prompt.includes("open google")) {
        speak("Opening Google search.");
        output.innerText = "KALKI: Opening Google...";

        if (isMobile) {
          window.location.assign("https://www.google.com");
        } else {
          const win = window.open("https://www.google.com", "_blank");
          if (!win) window.location.href = "https://www.google.com";
        }
        return true;
      }

      return false;
    }

    // Gemini API integration
    async function queryAI(prompt) {
      const apiKey = "AQ.Ab8RN6ImJrigVfyfz8N3VItZHtrxecun4WtApjU5LKDqY33K-A";
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

      try {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();

        if (data.error) {
          return `API Error: ${data.error.message}`;
        }

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          return data.candidates[0].content.parts[0].text;
        } else {
          return "Received an empty response from the AI.";
        }
      } catch (err) {
        return `Network Error: ${err.message}`;
      }
    }

    // Voice Synthesis Output
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
